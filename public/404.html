<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Nanotel</title>
    <script>
      // Redirect all 404s to index.html while keeping path
      var path = window.location.pathname;
      var search = window.location.search || "";
      var hash = window.location.hash || "";
      window.location.replace("/" + "#" + path + search + hash);
    </script>
  </head>
  <body></body>
</html>
